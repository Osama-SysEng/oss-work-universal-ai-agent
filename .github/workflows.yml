name: safe-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps (framework + live-app backend share fastapi/pydantic)
        run: python -m pip install -e ".[dev]"
      - name: Compile source
        run: python -m compileall -q core scripts live-app
      - name: Run tests (framework + live-app agent engine)
        run: python -m pytest
