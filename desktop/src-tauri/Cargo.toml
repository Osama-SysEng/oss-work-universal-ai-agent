[package]
name = "oss-work-desktop"
version = "1.0.0-dev"
description = "OSS Work — Open-Source Universal AI Agent Desktop Application"
authors = ["Osama Mohamed Fathy"]
edition = "2021"

[lib]
name = "oss_work_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-debugout = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
