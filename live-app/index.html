<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OS_V1 — وكيل أوس</title>
<style>
  :root { --bg:#0a0a0f; --panel:#12121c; --line:#23233a; --cyan:#00c8ff;
          --ok:#2bd576; --warn:#ffb020; --err:#ff5470; --text:#e8ecf4; --dim:#8b93a7; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:"Segoe UI",Tahoma,sans-serif; min-height:100vh; }
  header { display:flex; align-items:center; justify-content:space-between;
           padding:14px 22px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:18px; color:var(--cyan); }
  #health { font-size:13px; color:var(--dim); }
  #health b { color:var(--ok); }
  main { max-width:860px; margin:0 auto; padding:18px 16px 60px; }
  .modes { display:flex; gap:8px; margin:14px 0 10px; flex-wrap:wrap; }
  .chip { border:1px solid var(--line); background:var(--panel); color:var(--dim);
          padding:7px 16px; border-radius:999px; cursor:pointer; font-size:14px; }
  .chip.on { border-color:var(--cyan); color:var(--cyan); font-weight:600; }
  textarea { width:100%; min-height:96px; background:var(--panel); color:var(--text);
             border:1px solid var(--line); border-radius:12px; padding:12px;
             font:inherit; resize:vertical; }
  .row { display:flex; gap:10px; margin-top:10px; align-items:center; flex-wrap:wrap; }
  button.primary { background:var(--cyan); color:#031018; border:0; border-radius:10px;
                   padding:11px 26px; font-weight:700; cursor:pointer; font-size:15px; }
  button.primary:disabled { opacity:.5; cursor:wait; }
  button.ghost { background:transparent; color:var(--dim); border:1px solid var(--line);
                 border-radius:10px; padding:10px 18px; cursor:pointer; font-size:14px; }
  label.res { color:var(--dim); font-size:13px; display:flex; gap:6px; align-items:center; }
  #session { background:var(--panel); color:var(--text); border:1px solid var(--line);
             border-radius:8px; padding:6px 10px; font-size:12px; width:220px; }
  #stream { margin-top:18px; }
  .status { color:var(--dim); font-size:14px; padding:4px 0; border-bottom:1px dashed var(--line); }
  .answer { background:var(--panel); border:1px solid var(--line); border-radius:12px;
            padding:14px; margin-top:12px; white-space:pre-wrap; line-height:1.8; }
  .done { margin-top:8px; font-size:13px; color:var(--ok); }
  .audit { margin-top:14px; background:var(--panel); border:1px solid var(--line);
           border-radius:12px; padding:14px; font-size:14px; line-height:1.9; }
  .audit .v { font-size:16px; font-weight:700; }
  .err { color:var(--err); }
  .pulse { animation:p 1s infinite; } @keyframes p { 50% { opacity:.4; } }
</style>
</head>
<body>
<header>
  <h1>🤖 OS_V1 — وكيل أوس</h1>
  <div id="health">…</div>
</header>
<main>
  <div class="modes" id="modes">
    <div class="chip on" data-m="solo">فردي</div>
    <div class="chip" data-m="project">مشروع طويل</div>
    <div class="chip" data-m="team">سرب وكلاء</div>
  </div>
  <textarea id="task" placeholder="اكتب مهمتك… مثال: ابنِ موقعاً لمطعم فيه قائمة وأسعار ونموذج حجز — أو: حلل هذه المساحة واقترح تحسينات."></textarea>
  <div class="row">
    <button class="primary" id="go">شغّل المهمة</button>
    <button class="ghost" id="stop">إيقاف</button>
    <button class="ghost" id="audit">🛡️ تدقيق أمني</button>
    <label class="res"><input type="checkbox" id="resume" /> استئناف جلسة</label>
    <input id="session" placeholder="اسم الجلسة" />
  </div>
  <div id="stream"></div>
  <div id="auditbox"></div>
</main>
<script>
const $ = s => document.querySelector(s);
let mode = "solo", ctrl = null, session = "s_" + Date.now().toString(36);
$("#session").value = session;

document.querySelectorAll("#modes .chip").forEach(c => c.onclick = () => {
  document.querySelectorAll("#modes .chip").forEach(x => x.classList.remove("on"));
  c.classList.add("on"); mode = c.dataset.m;
  if (mode === "project") $("#resume").checked = true;
});

fetch("/api/health").then(r => r.json()).then(h =>
  $("#health").innerHTML = "المحرك: <b>" + (h.status === "ok" ? "يعمل" : "متوقف") + "</b>")
  .catch(() => $("#health").innerHTML = "<span class='err'>الباكند غير متصل</span>");

function line(txt, cls) {
  const d = document.createElement("div");
  d.className = cls || "status"; d.textContent = txt;
  $("#stream").appendChild(d); return d;
}

async function run() {
  const task = $("#task").value.trim();
  if (!task) { line("اكتب مهمة أولاً.", "err"); return; }
  if ($("#resume").checked) session = $("#session").value || session;
  else { session = "s_" + Date.now().toString(36); $("#session").value = session; }
  $("#stream").innerHTML = ""; $("#auditbox").innerHTML = "";
  const go = $("#go"); go.disabled = true; go.textContent = "يعمل…";
  const pl = line("⏳ أرسلت المهمة إلى الوكيل…", "status pulse");
  ctrl = new AbortController();
  try {
    const res = await fetch("/api/v1/agent/run", {
      method: "POST", signal: ctrl.signal,
      headers: { "Content-Type": "application/json; charset=utf-8" },
      body: JSON.stringify({ task, session_id: session, device: "safe",
                             mode, resume: $("#resume").checked }) });
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "", ans = null, done = null;
    while (true) {
      const { value, done: end } = await reader.read();
      if (end) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\\n"); buf = lines.pop();
      for (const ln of lines) {
        if (!ln.startsWith("data: ")) continue;
        let ev; try { ev = JSON.parse(ln.slice(6)); } catch { continue; }
        if (ev.type === "status") {
          pl.classList.remove("pulse");
          line(ev.text);
          pl = line("⏳ …", "status pulse");
        } else if (ev.type === "delta") {
          pl.remove();
          ans = line(ev.text, "answer");
        } else if (ev.type === "done") {
          pl.remove();
          done = line("✅ " + (ev.engine || "") + " — خطوات: " +
                (ev.agent_steps || 0) + " · أدوات: " +
                ((ev.tools_used || []).join(", ") || "لا شيء"), "done");
        }
      }
    }
    if (!done && ans) ans.after ? 0 : 0;
  } catch (e) {
    if (e.name !== "AbortError") line("فشل الاتصال: " + e, "err");
  }
  go.disabled = false; go.textContent = "شغّل المهمة";
}

$("#go").onclick = run;
$("#stop").onclick = () => ctrl && ctrl.abort();
$("#audit").onclick = async () => {
  $("#auditbox").innerHTML = "<div class='audit'>⏳ تهاجم البطارية دفاعاتنا الحقيقية…</div>";
  try {
    const r = await (await fetch("/api/v1/security/audit")).json();
    $("#auditbox").innerHTML =
      "<div class='audit'><div class='v' style='color:" +
      (r.battery.all_ok && r.static.real_clean ? "var(--ok)" : "var(--err)") +
      "'>" + r.verdict + "</div>" +
      "الهجمات المصدودة: " + r.battery.attacks + " · الضوابط: " + r.battery.controls +
      "<br>فحص ثابت: ملفات " + r.static.files_scanned +
      " — ثغرات حقيقية: " + r.static.real_count +
      " (قمع الهجمات المعلن: " + r.static.corpus_count + ")" +
      "<br><span style='color:var(--dim)'>" + r.report + "</span></div>";
  } catch (e) {
    $("#auditbox").innerHTML = "<div class='audit err'>فشل التدقيق: " + e + "</div>";
  }
};
</script>
</body>
</html>
