<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OSS Work — مركز قيادة الوكيل (النموذج OS_V1)</title>
<style>
  :root { --bg:#05060e; --panel:rgba(16,18,32,.72); --line:rgba(90,120,255,.16);
          --cyan:#00c8ff; --ok:#2bd576; --warn:#ffb020; --err:#ff5470;
          --text:#e8ecf4; --dim:#8b93a7; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); overflow:hidden;
         font-family:"Segoe UI",Tahoma,sans-serif; }
  #orb { position:fixed; inset:0; z-index:0; }
  #glow { position:fixed; z-index:0; left:50%; top:24%; width:560px; height:560px;
          transform:translate(-50%,-50%); border-radius:50%; pointer-events:none;
          background:radial-gradient(circle, rgba(0,200,255,.10), transparent 65%);
          filter:blur(10px); transition:background .8s; }
  header { position:fixed; top:0; right:0; left:0; z-index:5; display:flex;
           align-items:center; justify-content:space-between; padding:10px 20px;
           background:linear-gradient(rgba(5,6,14,.92), rgba(5,6,14,.55), transparent); }
  header .logo { display:flex; align-items:center; gap:10px; }
  header .logo b { font-size:17px; color:var(--cyan); }
  .chipm { border:1px solid var(--line); background:var(--panel); color:var(--dim);
           padding:4px 12px; border-radius:999px; font-size:12px; }
  .chipm b { color:var(--ok); }
  header .acts { display:flex; gap:8px; }
  .ibtn { border:1px solid var(--line); background:var(--panel); color:var(--dim);
          border-radius:10px; padding:7px 13px; cursor:pointer; font-size:14px; }
  .ibtn:hover { color:var(--cyan); border-color:var(--cyan); }
  #chat { position:fixed; inset:0; z-index:1; overflow-y:auto; padding:70px 16px 150px; }
  #chat::-webkit-scrollbar { width:6px; } #chat::-webkit-scrollbar-thumb { background:#1d2440; border-radius:3px; }
  .wrap { max-width:820px; margin:0 auto; }
  .u, .a { max-width:86%; margin:10px 0; line-height:1.9; font-size:15px;
           white-space:pre-wrap; word-break:break-word; }
  .u { margin-right:auto; background:rgba(0,120,200,.16); border:1px solid rgba(0,200,255,.35);
       padding:11px 16px; border-radius:16px 16px 4px 16px; }
  .a { margin-left:auto; background:var(--panel); border:1px solid var(--line);
       padding:12px 16px; border-radius:16px 16px 16px 4px;
       backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
  .job { max-width:92%; margin:14px auto; background:var(--panel); border:1px solid var(--line);
         border-radius:14px; padding:12px 16px; backdrop-filter:blur(12px);
         -webkit-backdrop-filter:blur(12px); }
  .job .jt { color:var(--cyan); font-size:13px; font-weight:700; margin-bottom:6px; }
  .job .steps { font-size:12.5px; color:var(--dim); line-height:1.9; max-height:180px;
                overflow-y:auto; border-inline-start:2px solid #16203a; padding-inline-start:10px; }
  .job .steps .ok-l { color:var(--ok); }
  .job .steps .bad-l { color:var(--err); }
  .job .fin { margin-top:8px; font-size:14.5px; white-space:pre-wrap; line-height:1.9;
              border-top:1px dashed var(--line); padding-top:8px; }
  .job .meta { margin-top:8px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .tag { font-size:11.5px; color:var(--dim); border:1px solid var(--line);
         border-radius:999px; padding:3px 10px; }
  .tag.g { color:var(--ok); border-color:rgba(43,213,118,.4); }
  .openbtn { background:var(--ok); color:#031018; border:0; border-radius:8px;
             padding:7px 14px; font-weight:700; cursor:pointer; font-size:13px; }
  #composer { position:fixed; bottom:0; right:0; left:0; z-index:5;
              background:linear-gradient(transparent, rgba(5,6,14,.9) 40%); padding:20px 16px 18px; }
  .cwrap { max-width:820px; margin:0 auto; background:var(--panel); border:1px solid var(--line);
           border-radius:18px; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
           padding:10px 14px; }
  .crow { display:flex; gap:10px; align-items:flex-end; }
  #msg { flex:1; background:transparent; border:0; outline:0; color:var(--text);
         font:inherit; resize:none; max-height:130px; padding:8px 4px; }
  #send { background:var(--cyan); color:#031018; border:0; border-radius:12px;
          padding:9px 20px; font-weight:800; cursor:pointer; font-size:14px; }
  #send:disabled { opacity:.45; cursor:wait; }
  .modes { display:flex; gap:6px; padding:6px 4px 2px; flex-wrap:wrap; align-items:center; }
  .mchip { border:1px solid var(--line); background:transparent; color:var(--dim);
           padding:3px 12px; border-radius:999px; cursor:pointer; font-size:12px; }
  .mchip.on { border-color:var(--cyan); color:var(--cyan); font-weight:700; }
  .modes .adv { margin-inline-start:auto; display:flex; gap:10px; align-items:center;
                font-size:12px; color:var(--dim); }
  .modes .adv input { accent-color:var(--cyan); }
  #sname { width:150px; background:rgba(0,0,0,.3); color:var(--text);
           border:1px solid var(--line); border-radius:8px; padding:3px 8px; font-size:12px; }
  /* ---------- overlays ---------- */
  #ov { position:fixed; inset:0; z-index:20; background:rgba(3,4,10,.7);
        backdrop-filter:blur(6px); display:none; }
  #ov.on { display:flex; }
  #ovbox { margin:auto; width:min(680px, 94vw); max-height:82vh; overflow-y:auto;
           background:#0d1020; border:1px solid var(--line); border-radius:16px;
           padding:18px 20px; }
  #ovbox h3 { margin:0 0 12px; color:var(--cyan); display:flex; justify-content:space-between; }
  #ovbox h3 span { cursor:pointer; color:var(--dim); }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px;
           padding:12px 14px; font-size:14px; line-height:1.9; margin-bottom:10px; }
  .v { font-size:15px; font-weight:700; }
  .err { color:var(--err); } .ok-c { color:var(--ok); } .dim { color:var(--dim); }
  input.txt { width:100%; background:rgba(0,0,0,.3); color:var(--text); border:1px solid var(--line);
              border-radius:10px; padding:9px 12px; font:inherit; margin:6px 0; }
  button.primary { background:var(--cyan); color:#031018; border:0; border-radius:10px;
                   padding:9px 20px; font-weight:700; cursor:pointer; font-size:14px; }
  #gallery { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:8px; }
  #gallery img, #gallery video { width:100%; border-radius:10px; border:1px solid var(--line); }
  .recipe { border-bottom:1px dashed var(--line); padding:6px 0; }
  .recipe b { color:var(--cyan); }
  .pulse { animation:p 1s infinite; } @keyframes p { 50% { opacity:.35; } }
</style>
</head>
<body>
<canvas id="orb"></canvas>
<div id="glow"></div>

<header>
  <div class="logo"><b>🏗️ OSS Work</b>
    <span class="chipm">النموذج: <b>OS_V1</b></span>
    <span class="chipm" id="eng">المحرك: …</span>
  </div>
  <div class="acts">
    <button class="ibtn" data-ov="media">🎨 وسائط</button>
    <button class="ibtn" data-ov="sec">🛡️ الأمن</button>
    <button class="ibtn" data-ov="lib">🧠 المكتبة</button>
  </div>
</header>

<div id="chat"><div class="wrap" id="log">
  <div class="a" style="text-align:center;max-width:70%;margin:26px auto">
    مرحباً 👋 أنا <b>OSS Work</b> — كل شيء هنا في محادثة واحدة: اسألني أي شيء، أو اطلب بناء موقع أو تطبيق أو مشروعاً كاملاً وسأعمل بأدوات حقيقية أمامك خطوة بخطوة.
  </div>
</div></div>

<div id="composer"><div class="cwrap">
  <div class="modes" id="modes">
    <div class="mchip on" data-m="auto">تلقائي</div>
    <div class="mchip" data-m="solo">فردي</div>
    <div class="mchip" data-m="team">سرب وكلاء</div>
    <div class="mchip" data-m="project">مشروع طويل</div>
    <div class="adv">
      <label><input type="checkbox" id="full" /> أدوات كاملة</label>
      <label><input type="checkbox" id="resume" /> استئناف</label>
      <input id="sname" title="اسم الجلسة" />
    </div>
  </div>
  <div class="crow">
    <textarea id="msg" rows="1" placeholder="اكتب رسالتك… «من أنت؟» أو «ابن لي موقعاً لمدارس بواجهة وخلفية وقاعدة بيانات»"></textarea>
    <button id="send">إرسال</button>
  </div>
</div></div>

<div id="ov"><div id="ovbox">
  <h3><b id="ovtitle"></b><span onclick="closeOv()">✕</span></h3>
  <div id="ovbody"></div>
</div></div>

<script>
"use strict";
const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);
const session = localStorage.osv_session ||
  (localStorage.osv_session = "s_" + Date.now().toString(36));
$("#sname").value = session;
let mode = "auto", busy = false;

/* ============ الكرة ثلاثية الأبعاد (بلا اعتماديات) ============ */
const cv = $("#orb"), cx = cv.getContext("2d");
let W, H, mx = 0, my = 0, state3d = "idle";
function size3d() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
addEventListener("resize", size3d); size3d();
addEventListener("pointermove", e => {
  mx = e.clientX / innerWidth - .5; my = e.clientY / innerHeight - .5;
});
const N = 460, PTS = [];
for (let i = 0; i < N; i++) {
  const y = 1 - (i / (N - 1)) * 2, rad = Math.sqrt(1 - y * y), th = i * 2.39996;
  PTS.push([Math.cos(th) * rad, y, Math.sin(th) * rad]);
}
const COLS = { idle:["#1c5f7d","#00c8ff"], think:["#00c8ff","#9feaff"],
               build:["#1e9c5b","#7dffc0"], err:["#a03050","#ff8fae"] };
let rotY = 0;
function orb() {
  const t = Date.now() / 1000;
  rotY += state3d === "build" ? .011 : state3d === "think" ? .007 : .0025;
  const [c1, c2] = COLS[state3d] || COLS.idle;
  cx.clearRect(0, 0, W, H);
  const pulse = state3d === "build" ? Math.sin(t * 5) * 10 : 0;
  const R = Math.min(W, H) * .21 + pulse;
  const ccx = W / 2 + mx * 46, ccy = H * .3 + my * 34;
  const cY = Math.cos(rotY), sY = Math.sin(rotY), cX = Math.cos(.35), sX = Math.sin(.35);
  for (const p of PTS) {
    const x1 = p[0] * cY + p[2] * sY, z1 = -p[0] * sY + p[2] * cY;
    const y1 = p[1] * cX - z1 * sX, z2 = p[1] * sX + z1 * cX;
    const d = (z2 + 1) / 2, per = 1.9 - z2 * .55;
    cx.globalAlpha = .1 + d * .6;
    cx.fillStyle = d > .55 ? c2 : c1;
    cx.beginPath();
    cx.arc(ccx + x1 * R * per, ccy + y1 * R * per, d * 2.3, 0, 6.283);
    cx.fill();
  }
  cx.globalAlpha = 1;
  $("#glow").style.background =
    "radial-gradient(circle, " + (state3d === "build" ? "rgba(43,213,118,.12)"
      : state3d === "think" ? "rgba(0,200,255,.14)" : "rgba(0,200,255,.08)")
    + ", transparent 65%)";
  requestAnimationFrame(orb);
}
orb();
function set3d(s) { state3d = s; }

/* ============ الصحة ============ */
function health() {
  fetch("/api/health").then(r => r.json()).then(h =>
    $("#eng").innerHTML = "المحرك: <b>" + (h.engine ? "يعمل" : "سحابي") + "</b>")
    .catch(() => $("#eng").innerHTML = "<span class='err'>غير متصل</span>");
}
health(); setInterval(health, 30000);

/* ============ عناصر المحادثة ============ */
const log = $("#log");
function el(cls, html) {
  const d = document.createElement("div"); d.className = cls;
  if (html !== undefined) d.innerHTML = html; log.appendChild(d);
  d.scrollIntoView({ behavior: "smooth", block: "end" }); return d;
}
function nearBottom() {
  return log.scrollHeight - $("#chat").scrollTop - $("#chat").clientHeight < 160;
}
function stick() { $("#chat").scrollTop = $("#chat").scrollHeight; }

/* ============ المحادثة (بث حي) ============ */
async function chat(msg, box) {
  state3d = "think"; box.classList.add("pulse");
  try {
    const res = await fetch("/api/v1/chat/stream", { method: "POST",
      headers: { "Content-Type": "application/json; charset=utf-8" },
      body: JSON.stringify({ message: msg, model: "os_v1", session_id: session }) });
    const rd = res.body.getReader(), dec = new TextDecoder(); let buf = "";
    while (true) {
      const { value, done: end } = await rd.read(); if (end) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n"); buf = lines.pop();
      for (const ln of lines) {
        if (!ln.startsWith("data: ")) continue;
        try {
          const ev = JSON.parse(ln.slice(6));
          if (ev.type === "delta" && ev.text) { box.textContent += ev.text; stick(); }
        } catch (e) {}
      }
    }
  } catch (e) { box.textContent += "\n⚠️ فشل: " + e; }
  box.classList.remove("pulse"); set3d("idle");
}

/* ============ مهمة وكيل (خلفية + بث حي) ============ */
async function job(msg, m) {
  state3d = "build";
  const card = el("job");
  card.innerHTML = "<div class='jt'>🤖 OSS Work يعمل — " +
    (m === "team" ? "سرب وكلاء" : m === "project" ? "مشروع طويل" : "مهمة فردية") +
    " <span class='dim'>(يستمر حتى لو أغلقت الصفحة)</span></div>" +
    "<div class='steps'></div><div class='fin dim pulse'>⏳ يعمل الآن…</div>";
  const steps = card.querySelector(".steps"), fin = card.querySelector(".fin");
  let jid;
  try {
    const r = await (await fetch("/api/v1/agent/start", { method: "POST",
      headers: { "Content-Type": "application/json; charset=utf-8" },
      body: JSON.stringify({ task: msg, session_id: session, mode: m,
        device: $("#full").checked ? "full" : "safe",
        resume: $("#resume").checked }) })).json();
    jid = r.job_id;
  } catch (e) { fin.className = "fin err"; fin.textContent = "فشل البدء: " + e; set3d("err"); return; }
  try {
    const res = await fetch("/api/v1/agent/stream/" + jid);
    const rd = res.body.getReader(), dec = new TextDecoder(); let buf = "";
    const addStep = (txt, cls) => {
      const s = document.createElement("div"); if (cls) s.className = cls;
      s.textContent = txt; steps.appendChild(s); steps.scrollTop = steps.scrollHeight;
      while (steps.children.length > 60) steps.removeChild(steps.firstChild);
    };
    while (true) {
      const { value, done: end } = await rd.read(); if (end) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n"); buf = lines.pop();
      for (const ln of lines) {
        if (!ln.startsWith("data: ")) continue;
        let ev; try { ev = JSON.parse(ln.slice(6)); } catch (e) { continue; }
        if (ev.type === "status") {
          fin.classList.remove("pulse"); fin.classList.add("dim");
          fin.textContent = "⏳ " + ev.text;
          addStep("▸ " + ev.text); stick();
        } else if (ev.type === "agent_step") {
          addStep((ev.ok ? "✔ " : "✖ ") + (ev.tool || "") + " — دورة " + (ev.step || ""),
                  ev.ok ? "ok-l" : "bad-l"); stick();
        } else if (ev.type === "delta") {
          fin.className = "fin"; fin.textContent = ev.text || " ";
          stick();
        } else if (ev.type === "done") {
          const okRun = (ev.engine || "").includes("اكتمل");
          const meta = document.createElement("div"); meta.className = "meta";
          meta.innerHTML = "<span class='tag " + (okRun ? "g" : "") + "'>" +
            (ev.engine || "") + "</span>" +
            "<span class='tag'>خطوات: " + (ev.agent_steps || 0) + "</span>" +
            "<span class='tag'>أدوات: " + ((ev.tools_used || []).join("، ") || "—") + "</span>" +
            "<button class='openbtn'>🚀 فتح ما بُني</button>";
          card.appendChild(meta);
          meta.querySelector(".openbtn").onclick = () =>
            window.open("/api/v1/agent/preview/" + $("#sname").value + "/", "_blank");
          set3d(okRun ? "idle" : "err"); stick();
        }
      }
    }
  } catch (e) {
    fin.className = "fin err"; fin.textContent = "انقطع الاتصال بالمهمة (المهمة نفسها تستمر في الخلفية): " + e;
    set3d("err");
  }
}

/* ============ التوجيه ============ */
const BUILD_RX = /(ابن|أنشئ|انشئ|اصنع|صمّم|صمم|موقع|مشروع|تطبيق|صفحة|صفحات|واجهة|خلفية|قاعدة بيانات|برمج|سرب|فريق|اختبار|بوت|روبوت)/;
function send() {
  if (busy) return;
  const msg = $("#msg").value.trim(); if (!msg) return;
  $("#msg").value = ""; $("#msg").style.height = "auto";
  el("u"); log.lastChild.textContent = msg; busy = true; $("#send").disabled = true;
  let m = mode;
  if (m === "auto") {
    if (/سرب|فريق/.test(msg)) m = "team";
    else if (/مشروع طويل|مراحل|خطة/.test(msg)) m = "project";
    else if (BUILD_RX.test(msg)) m = "solo";
    else m = null;                                  // محادثة عادية
  }
  if (m) job(msg, m).finally(() => { busy = false; $("#send").disabled = false; });
  else chat(msg, el("a", "…"))
    .finally(() => { busy = false; $("#send").disabled = false; });
}
$("#send").onclick = send;
$("#msg").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$("#msg").addEventListener("input", e => {
  e.target.style.height = "auto"; e.target.style.height = e.target.scrollHeight + "px";
});
$$("#modes .mchip").forEach(c => c.onclick = () => {
  $$("#modes .mchip").forEach(x => x.classList.remove("on"));
  c.classList.add("on"); mode = c.dataset.m;
});

/* ============ إعادة الاتصال بالمهمات ============ */
(async () => {
  try {
    const r = await (await fetch("/api/v1/agent/jobs")).json();
    (r.jobs || []).slice(0, 3).forEach(j => {
      const when = new Date(j.started * 1000).toLocaleTimeString("ar");
      const st = j.state === "running"
        ? "<span class='ok-c'>◀ تعمل الآن — أعِد فتحها بالكتابة مع «استئناف»</span>"
        : "<span class='dim'>اكتملت " + when + "</span>";
      el("job", "<div class='jt'>📋 مهمة سابقة (" + when + ")</div>" +
        "<div style='font-size:13.5px'>" + j.task + "</div>" +
        "<div class='meta'><span class='tag'>" + st + "</span>" +
        "<button class='openbtn' style='font-size:12px'>فتح ما بُني</button></div>")
        .querySelector(".openbtn").onclick = () =>
          window.open("/api/v1/agent/preview/" + $("#sname").value + "/", "_blank");
    });
  } catch (e) {}
})();

/* ============ الطبقات (وسائط / أمن / مكتبة) ============ */
function closeOv() { $("#ov").classList.remove("on"); }
window.closeOv = closeOv;
$$("header .ibtn").forEach(b => b.onclick = () => openOv(b.dataset.ov));
function openOv(kind) {
  const t = $("#ovtitle"), b = $("#ovbody"); $("#ov").classList.add("on");
  if (kind === "media") {
    t.textContent = "🎨 الوسائط";
    b.innerHTML = "<div class='panel'>🖼️ <b>صورة</b> — وصف المشهد:" +
      "<input class='txt' id='ip' placeholder='مثال: قهوة عربية على صحراء عند الغروب'>" +
      "<button class='primary' id='gi'>توليد</button> <span id='io' class='dim'></span></div>" +
      "<div class='panel'>🎬 <b>فيديو حقيقي</b> — مشهد متحرك (دقائق):" +
      "<input class='txt' id='vp' placeholder='مثال: كاميرا تقترب من فنجان والبخار يتصاعد'>" +
      "<button class='primary' id='gv'>توليد</button> <span id='vo' class='dim'></span></div>" +
      "<div class='panel'><button class='ibtn' id='rg'>🔄 المعرض</button>" +
      "<div id='gal' style='margin-top:10px'></div></div>";
    $("#gi").onclick = () => mpost("/api/v1/media/image", { prompt: $("#ip").value }, $("#io"));
    $("#gv").onclick = () => mpost("/api/v1/media/video", { prompt: $("#vp").value }, $("#vo"));
    $("#rg").onclick = gallery; gallery();
  } else if (kind === "sec") {
    t.textContent = "🛡️ التدقيق الأمني";
    b.innerHTML = "<div class='panel'><button class='primary' id='au'>🛡️ شغّل التدقيق الكامل</button> " +
      "<span class='dim'>17 هجوماً على الدفاعات الحقيقية + فحص ثابت</span><div id='ao'></div></div>";
    $("#au").onclick = async () => {
      $("#ao").innerHTML = "⏳…";
      try {
        const r = await (await fetch("/api/v1/security/audit")).json();
        $("#ao").innerHTML = "<div class='v " + (r.battery.all_ok && r.static.real_clean ? "ok-c" : "err") + "'>" +
          r.verdict + "</div>هجمات مصدودة: " + r.battery.attacks + " · ضوابط: " + r.battery.controls +
          "<br>فحص ثابت: " + r.static.files_scanned + " ملفاً — ثغرات: " + r.static.real_count +
          "<br><span class='dim'>" + r.report + "</span>";
      } catch (e) { $("#ao").innerHTML = "<span class='err'>فشل: " + e + "</span>"; }
    };
  } else {
    t.textContent = "🧠 مكتبة التعلم — الطبقة المملوكة";
    b.innerHTML = "<div class='panel' id='lb'>⏳…</div>";
    fetch("/api/v1/distill/stats").then(x => x.json()).then(r => {
      const s = r.stats || {};
      let h = "مسارات: <b>" + s.trajectories + "</b> · ناجحة: <b>" + s.successful +
        "</b> · وصفات مستخلصة: <b>" + s.recipes + "</b>" +
        "<div class='dim'>تنمو مع كل مهمة ناجحة — بذرة النموذج الخاص.</div>";
      (r.recipes || []).forEach(x => {
        h += "<div class='recipe'><b>🧬 " + x.name + "</b><br>" +
          x.steps.map((s2, i) => (i + 1) + ") " + s2).join(" → ") + "</div>";
      });
      $("#lb").innerHTML = h;
    }).catch(e => $("#lb").textContent = "فشل: " + e);
  }
}
async function mpost(url, body, out) {
  out.textContent = "⏳ يولّد…";
  try {
    const r = await (await fetch(url, { method: "POST",
      headers: { "Content-Type": "application/json; charset=utf-8" },
      body: JSON.stringify(body) })).json();
    out.textContent = r.ok ? "✅ " + r.observation : "❌ " + r.observation;
    if (url.includes("media")) gallery();
  } catch (e) { out.textContent = "فشل: " + e; }
}
async function gallery() {
  const g = $("#gal"); if (!g) return;
  try {
    const r = await (await fetch("/api/v1/media/list")).json();
    g.innerHTML = "";
    (r.list || []).slice(0, 24).forEach(item => {
      const name = String(item).replace(/\\/g, "/").split("/").pop();
      const mm = name.match(/^(osv_(img|vid)_\d{8}_\d{6}\.(jpg|png|webp|gif|mp4)|osv_(mot|cine)_[0-9a-z]{8}\.mp4)$/);
      if (!mm) return;
      if (mm[2] === "img") { const im = document.createElement("img"); im.src = "/api/v1/media/file/" + name; g.appendChild(im); }
      else { const v = document.createElement("video"); v.src = "/api/v1/media/file/" + name; v.controls = true; v.muted = true; g.appendChild(v); }
    });
    if (!g.children.length) g.innerHTML = "<span class='dim'>لا وسائط بعد.</span>";
  } catch (e) { g.innerHTML = "<span class='err'>فشل: " + e + "</span>"; }
}
