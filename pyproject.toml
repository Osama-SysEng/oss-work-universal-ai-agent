[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-work"
version = "1.0.0"
description = "OSS Work / OS_V1 — a local, independent, unified AI agent that plans, decides, verifies, and acts"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Osama Mohamed Fathy"}]
requires-python = ">=3.11"
keywords = ["ai-agent", "local-first", "offline", "multi-agent", "verification", "safety"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The core runs on the standard library plus these two: the local engine
# client and the local API. Everything else is optional.
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.3"]
browser = ["playwright>=1.44"]
office = ["python-docx>=1.1"]
laya = ["torch>=2.2", "transformers>=4.40"]

[project.scripts]
oss-v1 = "osv1.interface.cli:main"
oss-v1-api = "osv1.interface.api:main"

[project.urls]
Homepage = "https://github.com/Osama-SysEng/oss-work-universal-ai-agent"
Source = "https://github.com/Osama-SysEng/oss-work-universal-ai-agent"
Issues = "https://github.com/Osama-SysEng/oss-work-universal-ai-agent/issues"

[tool.setuptools.packages.find]
include = ["osv1*"]

[tool.setuptools.package-data]
"osv1.interface" = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", "data-osv1", "workspace", "skills-osv1"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "RET", "SIM"]
ignore = [
    "S101",  # asserts are used in the test suite
    "B008",  # FastAPI dependencies call functions in defaults
    "E501",  # long lines are checked by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "E402", "F401"]
"osv1/interface/web/*" = ["E501"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.pyright]
include = ["osv1/**/*.py", "tests/**/*.py"]
exclude = ["data-osv1/**", "workspace/**", ".git/**", ".pytest_cache/**", "__pycache__/**"]
