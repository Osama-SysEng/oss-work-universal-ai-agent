[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-work"
version = "0.2.0"
description = "Safe, local-first multi-agent AI runtime foundation"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "OSS-Work contributors"}]
dependencies = []

[project.scripts]
oss-work = "core.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
